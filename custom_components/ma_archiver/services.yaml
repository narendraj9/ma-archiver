archive_now:
  name: Archive All Remaining Tracks Now
  description: Scan the Music Assistant library and archive every remaining unarchived track to /media. Ignored if an archive run is already in progress.

archive_track:
  name: Archive Track by URI
  description: Archive a specific Music Assistant track URI (e.g. library://track/123 or provider://track/id) to /media.
  fields:
    uri:
      name: Track URI
      description: Music Assistant track URI to archive.
      required: true
      example: "library://track/952"
      selector:
        text:

refresh_library:
  name: Refresh Library Items
  description: Attach substitutes from active providers to library tracks that only have dead/removed provider mappings, then refresh the tags and embedded cover art of all archived files (atomic, lossless in-place update). Ignored if a refresh is already in progress.

reset_archive:
  name: Reset Archive
  description: Clear pending queue and failed-track cache, and optionally delete all archived files in the archive directory so archival starts fresh.
  fields:
    delete_files:
      name: Delete Archived Files
      description: Delete all files inside the configured archive directory (/media/archive).
      required: false
      default: true
      selector:
        boolean:
